<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>番茄专注钟</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.5"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto max-w-md space-y-6 px-4 py-8">
  <header class="space-y-1">
    <h1 class="text-2xl font-bold">🍅 番茄专注钟</h1>
    <p class="text-sm text-slate-600">25 分钟专注，5 分钟休息</p>
  </header>
  <section class="rounded-2xl border border-slate-200 bg-white p-6 text-center shadow-sm">
    <div id="mode" class="text-sm font-medium text-rose-600">专注中</div>
    <div id="time" class="mt-2 text-6xl font-bold tabular-nums">25:00</div>
    <div class="mt-6 flex justify-center gap-3">
      <button id="start" class="rounded-xl bg-rose-600 px-5 py-2 text-sm font-medium text-white hover:bg-rose-700 transition">开始</button>
      <button id="reset" class="rounded-xl border border-slate-300 bg-white px-5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 transition">重置</button>
    </div>
  </section>
  <section class="rounded-2xl border border-slate-200 bg-white p-5">
    <div class="text-xs text-slate-400">今日完成</div>
    <div id="count" class="mt-1 text-3xl font-bold">0</div>
  </section>
</main>
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-2 text-sm text-white opacity-0 transition"></div>
<script>
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',2000);}
function load(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback;}catch(e){return fallback;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}
const FOCUS = 25 * 60, BREAK = 5 * 60;
let state = { left: FOCUS, focus: true, running: false };
let stats = load('app:pomodoro:stats', { day: '', count: 0 });
const today = new Date().toISOString().slice(0, 10);
if (stats.day !== today) stats = { day: today, count: 0 };
let timer = null;
function render() {
  const m = String(Math.floor(state.left / 60)).padStart(2, '0');
  const s = String(state.left % 60).padStart(2, '0');
  document.getElementById('time').textContent = m + ':' + s;
  document.getElementById('mode').textContent = state.focus ? '专注中' : '休息中';
  document.getElementById('start').textContent = state.running ? '暂停' : '开始';
  document.getElementById('count').textContent = String(stats.count);
}
function tick() {
  state.left -= 1;
  if (state.left <= 0) {
    if (state.focus) { stats.count += 1; save('app:pomodoro:stats', stats); toast('完成一个番茄！休息一下'); }
    state.focus = !state.focus;
    state.left = state.focus ? FOCUS : BREAK;
  }
  render();
}
document.getElementById('start').addEventListener('click', () => {
  state.running = !state.running;
  if (state.running) timer = setInterval(tick, 1000); else clearInterval(timer);
  render();
});
document.getElementById('reset').addEventListener('click', () => {
  clearInterval(timer);
  state = { left: FOCUS, focus: true, running: false };
  render();
  toast('已重置');
});
render();
undefinedFunctionCall();
</script>
</body>
</html>
