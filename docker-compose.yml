services:
  app:
    build: .
    image: atoms-demo:latest
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    expose:
      - "3000"
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
